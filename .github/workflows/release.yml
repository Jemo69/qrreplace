name: Build + Release (single binary)

# Distribute QRReplace as one file per OS.
# Push a tag like v1.0.0 → Windows .exe, macOS .dmg and Linux binary
# are built and attached to the GitHub Release automatically.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build single .exe
        run: pyinstaller qrreplace.spec --noconfirm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRReplace-windows
          path: dist/QRReplace.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build single binary
        run: pyinstaller qrreplace.spec --noconfirm
      - name: Pack .dmg (single download)
        run: |
          hdiutil create -volname QRReplace -srcfolder dist/QRReplace.app \
            -ov -format UDZO dist/QRReplace-mac.dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRReplace-macos
          path: dist/QRReplace-mac.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Tk for the desktop window)
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build single binary
        run: pyinstaller qrreplace.spec --noconfirm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QRReplace-linux
          path: dist/QRReplace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release (one file per OS)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QRReplace-windows/QRReplace.exe
            artifacts/QRReplace-macos/QRReplace-mac.dmg
            artifacts/QRReplace-linux/QRReplace
          generate_release_notes: true
